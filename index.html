<!doctype html>
<html lang="ky">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Той Чакыруу — Генератор</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap"
			rel="stylesheet"
		/>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}
			body {
				font-family: 'Montserrat', sans-serif;
				min-height: 100vh;
				background: linear-gradient(
					135deg,
					#f9f3ec 0%,
					#f0e6d8 50%,
					#f5ede3 100%
				);
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 40px 20px;
			}
			h1 {
				font-family: 'Cormorant Garamond', serif;
				font-size: 2.2rem;
				font-weight: 600;
				color: #8b6c42;
				margin-bottom: 8px;
				text-align: center;
				letter-spacing: 0.04em;
			}
			.subtitle {
				font-size: 0.78rem;
				color: #b89b72;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				margin-bottom: 36px;
				text-align: center;
			}
			.admin-card {
				background: rgba(255, 255, 255, 0.88);
				border: 1px solid #e8d5b7;
				border-radius: 16px;
				padding: 32px 36px;
				width: 100%;
				max-width: 460px;
				box-shadow: 0 8px 40px rgba(139, 108, 66, 0.12);
				margin-bottom: 36px;
			}
			label {
				display: block;
				font-size: 0.7rem;
				letter-spacing: 0.16em;
				text-transform: uppercase;
				color: #a08050;
				margin-bottom: 10px;
				font-weight: 500;
			}
			.input-group {
				display: flex;
				align-items: center;
				gap: 12px;
				background: #fffaf5;
				border: 1px solid #e0c89a;
				border-radius: 10px;
				padding: 0 16px;
				transition:
					border-color 0.2s,
					box-shadow 0.2s;
				margin-bottom: 6px;
			}
			.input-group:focus-within {
				border-color: #c9a870;
				box-shadow: 0 0 0 3px rgba(201, 168, 112, 0.15);
			}
			.input-group input {
				flex: 1;
				border: none;
				background: transparent;
				padding: 14px 0;
				font-family: 'Montserrat', sans-serif;
				font-size: 1rem;
				color: #5a3e1b;
				outline: none;
			}
			.input-group input::placeholder {
				color: #c5a87a;
			}
			.hint {
				font-size: 0.7rem;
				color: #c9a870;
				margin-bottom: 22px;
				letter-spacing: 0.04em;
			}
			.preview-line {
				font-family: 'Cormorant Garamond', serif;
				font-size: 1.05rem;
				color: #8b6240;
				text-align: center;
				margin-bottom: 22px;
				min-height: 28px;
				font-style: italic;
			}
			.btn-generate {
				width: 100%;
				padding: 15px;
				background: linear-gradient(135deg, #c9a870, #a87840);
				color: #fff9f0;
				border: none;
				border-radius: 10px;
				font-family: 'Montserrat', sans-serif;
				font-size: 0.8rem;
				font-weight: 600;
				letter-spacing: 0.18em;
				text-transform: uppercase;
				cursor: pointer;
				transition: all 0.25s;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
			}
			.btn-generate:hover {
				background: linear-gradient(135deg, #d4b580, #b8884a);
				transform: translateY(-1px);
				box-shadow: 0 4px 20px rgba(139, 108, 66, 0.3);
			}
			.btn-generate:active {
				transform: translateY(0);
			}
			.btn-generate:disabled {
				opacity: 0.6;
				cursor: not-allowed;
				transform: none;
				box-shadow: none;
			}
			#canvas-wrap {
				width: 100%;
				max-width: 520px;
				display: none;
				flex-direction: column;
				align-items: center;
			}
			#canvas-wrap.visible {
				display: flex;
			}
			#inviteCanvas {
				width: 100%;
				border-radius: 8px;
				box-shadow: 0 16px 60px rgba(139, 108, 66, 0.22);
				display: block;
			}
			.action-btns {
				display: flex;
				gap: 14px;
				margin-top: 22px;
				width: 100%;
			}
			.btn-action {
				flex: 1;
				padding: 14px 20px;
				border-radius: 10px;
				border: none;
				font-family: 'Montserrat', sans-serif;
				font-size: 0.78rem;
				font-weight: 600;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 8px;
				transition: all 0.2s;
			}
			.btn-share {
				background: #fffaf5;
				color: #8b6c42;
				border: 1.5px solid #d4b07a;
			}
			.btn-share:hover {
				background: #f5ede0;
				border-color: #c09a60;
			}
			.btn-download {
				background: linear-gradient(135deg, #c9a870, #a87840);
				color: #fff9f0;
			}
			.btn-download:hover {
				background: linear-gradient(135deg, #d4b580, #b8884a);
				box-shadow: 0 4px 20px rgba(139, 108, 66, 0.3);
			}
			.modal-overlay {
				display: none;
				position: fixed;
				inset: 0;
				background: rgba(60, 35, 5, 0.55);
				z-index: 100;
				align-items: center;
				justify-content: center;
			}
			.modal-overlay.open {
				display: flex;
			}
			.modal {
				background: #fffaf5;
				border-radius: 16px;
				padding: 36px;
				width: 90%;
				max-width: 380px;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
				position: relative;
			}
			.modal h3 {
				font-family: 'Cormorant Garamond', serif;
				font-size: 1.7rem;
				color: #7a5a2a;
				margin-bottom: 4px;
			}
			.modal p {
				font-size: 0.78rem;
				color: #b89b72;
				margin-bottom: 26px;
				letter-spacing: 0.06em;
			}
			.share-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 10px;
				margin-bottom: 20px;
			}
			.share-btn {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 12px 14px;
				border-radius: 10px;
				border: 1px solid #e0c89a;
				background: #fffdf9;
				cursor: pointer;
				font-family: 'Montserrat', sans-serif;
				font-size: 0.78rem;
				color: #5a3e1b;
				font-weight: 500;
				transition: all 0.2s;
				text-decoration: none;
			}
			.share-btn:hover {
				background: #f5ede0;
				border-color: #c9a870;
				transform: translateY(-1px);
			}
			.share-icon {
				width: 30px;
				height: 30px;
				border-radius: 7px;
				display: flex;
				align-items: center;
				justify-content: center;
				flex-shrink: 0;
			}
			.modal-close {
				position: absolute;
				top: 14px;
				right: 14px;
				background: none;
				border: none;
				font-size: 1.3rem;
				cursor: pointer;
				color: #c9a870;
				padding: 4px 8px;
				border-radius: 6px;
				line-height: 1;
			}
			.modal-close:hover {
				background: #f5ede0;
			}
			.copy-row {
				display: flex;
				gap: 8px;
			}
			.copy-input {
				flex: 1;
				padding: 10px 12px;
				border: 1px solid #e0c89a;
				border-radius: 8px;
				font-size: 0.74rem;
				color: #8b6c42;
				background: #fffdf9;
				font-family: 'Montserrat', sans-serif;
				outline: none;
			}
			.copy-btn {
				padding: 10px 14px;
				background: #c9a870;
				color: #fff;
				border: none;
				border-radius: 8px;
				font-size: 0.74rem;
				cursor: pointer;
				font-family: 'Montserrat', sans-serif;
				font-weight: 600;
				white-space: nowrap;
				transition: background 0.2s;
			}
			.copy-btn:hover {
				background: #b8884a;
			}
			.spinner {
				display: none;
				width: 18px;
				height: 18px;
				border: 2px solid rgba(255, 255, 255, 0.4);
				border-top-color: #fff;
				border-radius: 50%;
				animation: spin 0.6s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body>
		<h1>Той Чакыруу</h1>
		<p class="subtitle">Коноктун атын жаз — чакыруу даяр болот</p>

		<div class="admin-card">
			<label>Коноктун аты</label>
			<div class="input-group">
				<svg
					width="18"
					height="18"
					fill="none"
					stroke="#c9a870"
					stroke-width="1.5"
					viewBox="0 0 24 24"
				>
					<circle cx="12" cy="8" r="4" />
					<path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
				</svg>
				<input
					type="text"
					id="guestName"
					placeholder="Мисалы: Самат Гулайым"
					maxlength="40"
				/>
			</div>
			<p class="hint">
				«Урматтуу ___» деген сапка жазылат. Карточка өзгөрбөйт.
			</p>
			<div class="preview-line" id="previewLine">Урматтуу ___________</div>
			<button class="btn-generate" id="generateBtn" onclick="generateCard()">
				<span id="btnLabel">✦ Даяр кылуу</span>
				<div class="spinner" id="spinner"></div>
			</button>
		</div>

		<div id="canvas-wrap">
			<canvas id="inviteCanvas"></canvas>
			<div class="action-btns">
				<button class="btn-action btn-share" onclick="openShare()">
					<svg
						width="15"
						height="15"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24"
					>
						<circle cx="18" cy="5" r="3" />
						<circle cx="6" cy="12" r="3" />
						<circle cx="18" cy="19" r="3" />
						<path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98" />
					</svg>
					Поделиться
				</button>
				<button class="btn-action btn-download" onclick="downloadCard()">
					<svg
						width="15"
						height="15"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						viewBox="0 0 24 24"
					>
						<path
							d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"
						/>
					</svg>
					Скачать
				</button>
			</div>
		</div>

		<!-- Share Modal -->
		<div
			class="modal-overlay"
			id="shareModal"
			onclick="closeShareOnOverlay(event)"
		>
			<div class="modal">
				<button class="modal-close" onclick="closeShare()">✕</button>
				<h3>Поделиться</h3>
				<p>Соцтармактар аркылуу жибер</p>
				<div class="share-grid">
					<a class="share-btn" onclick="shareToWhatsApp()">
						<div class="share-icon" style="background: #25d366">
							<svg width="16" height="16" viewBox="0 0 24 24" fill="white">
								<path
									d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"
								/>
							</svg>
						</div>
						WhatsApp
					</a>
					<a class="share-btn" onclick="shareToTelegram()">
						<div class="share-icon" style="background: #2ca5e0">
							<svg width="16" height="16" viewBox="0 0 24 24" fill="white">
								<path
									d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"
								/>
							</svg>
						</div>
						Telegram
					</a>
					<a class="share-btn" onclick="shareToVK()">
						<div class="share-icon" style="background: #4c75a3">
							<svg width="16" height="16" viewBox="0 0 24 24" fill="white">

									d="M11.701 18.771H12.932s.368-.04.557-.244c.173-.188.167-.543.167-.543s-.023-1.659.744-1.902c.755-.24 1.727 1.604 2.755 2.313.777.539 1.368.421 1.368.421l2.748-.038s1.437-.089.756-1.218c-.056-.092-.396-.833-2.037-2.355-1.718-1.595-1.487-1.337.581-4.098 1.257-1.674 1.759-2.697 1.602-3.135-.149-.418-1.069-.308-1.069-.308l-3.093.019s-.229-.031-.399.074c-.165.103-.272.345-.272.345s-.488 1.301-1.138 2.408c-1.372 2.33-1.921 2.454-2.146 2.309-.521-.337-.391-1.352-.391-2.074 0-2.252.341-3.19-.664-3.438-.333-.081-.578-.134-1.429-.143-1.092-.011-2.015.003-2.539.258-.349.169-.618.547-.454.568.203.026.663.124.907.457.317.43.306 1.394.306 1.394s.182 2.652-.424 2.982c-.416.224-.987-.233-2.21-2.326-.629-1.083-1.103-2.28-1.103-2.28s-.091-.236-.254-.362c-.198-.152-.474-.2-.474-.2L2.78 8.678s-.412.011-.563.191c-.133.16-.011.49-.011.49s2.353 5.507 5.015 8.283c2.441 2.548 5.215 2.381 5.215 2.381l.266-.012z"

					<a class="share-btn" onclick="shareNative()">
						<div class="share-icon" style="background: #8b6c42">
							<svg
								width="16"
								height="16"
								fill="none"
								stroke="white"
								stroke-width="2"
								viewBox="0 0 24 24"
							>
								<circle cx="18" cy="5" r="3" />
								<circle cx="6" cy="12" r="3" />
								<circle cx="18" cy="19" r="3" />
								<path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98" />
							</svg>
						</div>
						Башка
					</a>
				</div>
				<div class="copy-row">
					<input
						class="copy-input"
						type="text"
						id="shareText"
						readonly
						value="Улукмырза & Мадина — 26-июнь 2026, 16:00 | Ресторан ЭРМЕКБАЙ ГРАНД, Ош"
					/>
					<button class="copy-btn" onclick="copyText()">Көчүр</button>

		<script>
			const guestInput = document.getElementById('guestName')

			const ORIG_W = 1054
			const ORIG_H = 1492

			// Exact pixel positions measured from original image:
			// "Урматтуу" word: x=212..397, baseline y≈684
			// Underline: y=690, from x=237 to x=904
			// Guest name starts at: x=405, baseline y=684
			// Max width for name: 904-405 = 499px
			const NAME_X = 505 // where guest name starts
			const NAME_BASELINE_Y = 684 // text baseline
			const LINE_Y = 690 // underline y
			const LINE_END_X = 904 // underline ends here
			// Erase area: clear the line portion to the right of "Урматтуу"
			const ERASE_X = 900
			const ERASE_Y_TOP = 650
			const ERASE_Y_BOT = 696

			let weddingImg = null

			function loadImage() {
				return new Promise((resolve) => {
					if (weddingImg) {
						resolve(weddingImg)
						return
					}
					const img = new Image()
					img.onload = () => {
						weddingImg = img
						resolve(img)
					}
					img.src = WEDDING_IMG_B64
				})
			}

			function updatePreview() {
				const g = guestInput.value.trim()
				previewLine.innerHTML = g
					? `Урматтуу <span style="font-style:italic;color:#7a520a;">${g}</span>`
					: 'Урматтуу ___________'
			}

			guestInput.addEventListener('input', updatePreview)

			async function generateCard() {
				const guestName = guestInput.value.trim()

				const btn = document.getElementById('generateBtn')
				const label = document.getElementById('btnLabel')
				const spinner = document.getElementById('spinner')
				btn.disabled = true
				label.style.display = 'none'
				spinner.style.display = 'block'

				const img = await loadImage()
				const canvas = document.getElementById('inviteCanvas')
				canvas.width = ORIG_W
				canvas.height = ORIG_H
				const ctx = canvas.getContext('2d')

				// Step 1: Draw original image EXACTLY as-is
				ctx.drawImage(img, 0, 0, ORIG_W, ORIG_H)

				// Step 2: If guest name provided, overlay it on the blank line
				if (guestName) {
					// Sample background color from the line area (warm cream)
					const imgData = ctx.getImageData(ERASE_X, ERASE_Y_TOP, 2, 2)
					const bgR = imgData.data[0]
					const bgG = imgData.data[1]
					const bgB = imgData.data[2]

					// Erase the dashed underline to the right of "Урматтуу"
					// Use sampled background color
					ctx.fillStyle = `rgb(${bgR},${bgG},${bgB})`
					ctx.fillRect(
						ERASE_X,
						ERASE_Y_TOP,
						LINE_END_X - ERASE_X + 10,
						ERASE_Y_BOT - ERASE_Y_TOP + 2,
					)

					// Set font matching the original "Урматтуу" style
					// Original uses a serif font, ~46px at this resolution
					let fontSize = 46
					ctx.font = `500 ${fontSize}px "Cormorant Garamond", serif`
					ctx.textBaseline = 'alphabetic'
					ctx.textAlign = 'left'

					// Scale down if name is too long
					const maxWidth = LINE_END_X - NAME_X - 10
					while (ctx.measureText(guestName).width > maxWidth && fontSize > 24) {
						fontSize -= 2
						ctx.font = `500 ${fontSize}px "Cormorant Garamond", serif`
					}

					// Draw guest name in same dark color as "Урматтуу"
					ctx.fillStyle = '#3a2810'
					ctx.fillText(guestName, NAME_X, NAME_BASELINE_Y)
				}

				label.style.display = 'inline'
				spinner.style.display = 'none'
				btn.disabled = false

				const wrap = document.getElementById('canvas-wrap')
				wrap.classList.add('visible')
				wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
			}

			function downloadCard() {
				const canvas = document.getElementById('inviteCanvas')
				const guest = guestInput.value.trim() || 'конок'
				const dataURL = canvas.toDataURL('image/png', 1.0)
				const link = document.createElement('a')
				link.download = `той_чакыруу_${guest}.png`
				link.href = dataURL
				document.body.appendChild(link)
				link.click()
				document.body.removeChild(link)
			}

			function openShare() {
				document.getElementById('shareModal').classList.add('open')
			}
			function closeShare() {
				document.getElementById('shareModal').classList.remove('open')
			}
			function closeShareOnOverlay(e) {
				if (e.target === document.getElementById('shareModal')) closeShare()
			}

			function getShareText() {
				return 'Улукмырза & Мадина — 26-июнь 2026, 16:00 | Ресторан ЭРМЕКБАЙ ГРАНД, Ош'
			}

			function getInviteFile() {
				return new Promise((resolve) => {
					const canvas = document.getElementById('inviteCanvas')
					canvas.toBlob((blob) => {
						const guest = guestInput.value.trim() || 'конок'
						resolve(new File([blob], `той_чакыруу_${guest}.png`, { type: 'image/png' }))
					}, 'image/png', 1.0)
				})
			}

			async function shareWithPng() {
				const file = await getInviteFile()
				if (navigator.canShare && navigator.canShare({ files: [file] })) {
					try {
						await navigator.share({ files: [file], text: getShareText() })
						return
					} catch (e) {
						if (e.name === 'AbortError') return
					}
				}
				downloadCard()
				alert('Картинка жүктөлдү!\nАны WhatsApp же Telegram аркылуу кол менен жиберсеңиз болот.')
			}

			function shareToWhatsApp() { shareWithPng() }
			function shareToTelegram() { shareWithPng() }
			function shareToVK() { shareWithPng() }
			function shareNative() { shareWithPng() }
			function copyText() {
				if (navigator.clipboard) {
					navigator.clipboard.writeText(getShareText())
				} else {
					document.getElementById('shareText').select()
					document.execCommand('copy')
				}
				const btn = document.querySelector('.copy-btn')
				btn.textContent = '✓ Көчүрүлдү'
				setTimeout(() => (btn.textContent = 'Көчүр'), 2000)
			}

			loadImage()
		</script>
	</body>
</html>
